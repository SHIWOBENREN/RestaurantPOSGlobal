name: Public documentation safety
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public docs
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify public-only file allowlist and no packaged secrets
        run: python3 scripts/audit_public_repo.py
